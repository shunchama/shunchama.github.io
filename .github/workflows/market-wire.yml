name: Update market wire

on:
  schedule:
    - cron: "45 */6 * * *" # 6時間ごと（UTC）= 日本時間 0:45 / 6:45 / 12:45 / 18:45
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-wire
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch market wire
        run: python scripts/fetch_market_wire.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/market_wire.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/market_wire.json
          git commit -m "chore: update market wire"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
