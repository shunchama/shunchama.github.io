<style>

.hp {
  font-family: Verdana, "Hiragino Kaku Gothic ProN", "MS PGothic", "ＭＳ Ｐゴシック", sans-serif;
  font-size: 14px;
  line-height: 1.7;
  max-width: 760px;
}
.hp a { text-decoration: underline !important; }
.hp a:visited { color: #b48cff !important; }

.hp h2.hp-bar {

  margin: 28px 0 10px !important;
  padding: 3px 8px !important;
  background: #1c1c1c !important;

  border-left: 6px solid #00d4ff;
}
